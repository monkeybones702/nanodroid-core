[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bastion-asset-citadel"
version = "0.1.0"
description = "Hardened local security CLI, live proxy middleware, and background automation daemons."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer", email = "admin@bastionasset.local" }
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
aegis-hub = "bastion_asset.core.hub:main"
aegis-cli = "bastion_asset.core.cli:main"
aegis-proxy = "bastion_asset.core.proxy:main"
aegis-send = "bastion_asset.core.client:main"
aegis-report = "bastion_asset.core.reporter:main"
aegis-ghscan = "bastion_asset.core.ghscan:main"
aegis-rules = "bastion_asset.core.rules_mgr:main"
aegis-sim = "bastion_asset.core.simulator:main"
aegis-vault = "bastion_asset.core.vault:main"
aegis-query = "bastion_asset.core.query:main"
aegis-doctor = "bastion_asset.core.doctor:main"
aegis-backup = "bastion_asset.core.backup:main"
nanodroid = "bastion_asset.daemon.clipboard:main"
aegis-watchdog = "bastion_asset.daemon.watchdog:main"

[tool.hatch.build.targets.wheel]
packages = ["bastion_asset"]
